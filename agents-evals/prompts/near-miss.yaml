    text: >
      What's the best numerical method for stiff ODEs?
    skills_expected: []
    near_miss: true
    assertions:
      - id: no_pina_skill_load
        type: not_present
        values:
          - "pina-workflow"
          - "create-problem"
          - "define-equations"
          - "define-domains"
          - "condition-setup"
          - "select-model"
          - "select-solver"
          - "select-trainer"
          - "create-skill"
          - "skill-sync-checker"

